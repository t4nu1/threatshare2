<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organization Sign In | ThreatShare</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <main class="auth" id="main">
    <div class="auth__panel">
      <div class="auth__brand">
        <a class="site-brand" href="../index.html">
          <span class="site-brand__name">THREATSHARE</span>
          <span class="site-brand__subtitle">Organization Portal</span>
        </a>
      </div>
      <section class="card" aria-labelledby="login-title">
        <header class="card__header"><h1 class="card__title" id="login-title">Organization sign in</h1></header>
        <div class="card__body">
          <form class="form" id="login-form" novalidate>
            <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" required autocomplete="username">
      </div>
            <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" required autocomplete="current-password">
      </div>
            <div class="field">
        <label for="auth-code">Authentication code</label>
        <input class="input" id="auth-code" name="auth-code" type="text" required aria-describedby="auth-code-hint" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{{6}}" maxlength="6">
        <span class="field__hint" id="auth-code-hint">6-digit code from your authenticator app.</span>
      </div>
            <fieldset class="fieldset">
              <legend class="label">Digital signature verification</legend>
              <div class="form">
                <div class="field">
        <label for="challenge">Login challenge</label>
        <input class="input" id="challenge" name="challenge" type="text" value="ts-challenge-7f3a9c21e04b" aria-describedby="challenge-hint" readonly>
        <span class="field__hint" id="challenge-hint">Sign this challenge with your organization signing key.</span>
      </div>
                <div class="field">
        <label for="signature">Signature</label>
        <textarea class="textarea" id="signature" name="signature" aria-describedby="signature-hint" rows="3"></textarea>
        <span class="field__hint" id="signature-hint">Paste the signature produced by your signing tool.</span>
      </div>
              </div>
            </fieldset>
            <button class="btn btn--primary btn--block" type="submit">Sign in</button>
            <p class="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
      <p class="auth__links">New organization? <a href="register.html">Register your organization</a></p>
    </div>
  </main>
  <script src="../js/shared.js"></script>
  <script src="../js/org-login.js"></script>
</body>
</html>
